<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint - CampusCare</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>CampusCare</h1>

    <h2>Submit Your Complaint</h2>

    <form method="POST">

        <label>Complaint Title</label><br>
        <input
            type="text"
            name="title"
            placeholder="Enter complaint title"
            required
        >

        <br><br>

        <label>Complaint Category</label><br>
        <select name="category" required>
            <option value="">Select Category</option>
            <option>Hostel</option>
            <option>Classroom</option>
            <option>Electricity</option>
            <option>Cleanliness</option>
            <option>Water Problem</option>
            <option>Other</option>
        </select>

        <br><br>

        <label>Complaint Description</label><br>
        <textarea
            name="description"
            rows="6"
            placeholder="Explain your problem..."
            required
        ></textarea>

        <br><br>

        <button type="submit">Submit Complaint</button>

    </form>

    <br>

    <a class="dashboard" href="/template/dashboard.html"Back to dashboard></a>

</body>
</html>
